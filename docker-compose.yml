services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: duraknet
      POSTGRES_PASSWORD: duraknet
      POSTGRES_DB: duraknet
    ports: ["5433:5432"]  # yerel PostgreSQL 5432 kullanıyor
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duraknet"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]  # yerel Redis 6379 kullanıyor
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:

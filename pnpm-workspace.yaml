packages:
  - "apps/*"
  - "packages/*"

# pnpm bağımlılık build script'lerini varsayılan olarak engeller; kararlar burada.
allowBuilds:
  esbuild: true
  # testcontainers'ın dolaylı bağımlılıkları; native eklentiler isteğe bağlı, gerek yok.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # bullmq'nun (msgpackr) isteğe bağlı native hızlandırıcısı; yoksa saf JS'e düşer, gerek yok.
  msgpackr-extract: false
